services:
  - type: web
    name: serviprox-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && python backend/manage.py collectstatic --no-input"
    startCommand: "python backend/manage.py migrate --no-input && gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    plan: free
    autoDeploy: true
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "3600"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: serviprox-backend.onrender.com
      - key: SERVIPROX_DATABASE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: serviprox-db
          property: connectionString
      - key: SERVIPROX_MEDIA_STORAGE
        value: filesystem
      - key: CORS_ALLOWED_ORIGINS
        value: "https://serviprouc.netlify.app,https://serviproxweb.netlify.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: https://serviprox-backend.onrender.com

databases:
  - name: serviprox-db
    databaseName: serviprox
    user: serviprox
    plan: free
