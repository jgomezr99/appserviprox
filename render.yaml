services:
  - type: web
    name: serviprox-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && python backend/manage.py collectstatic --no-input"
    startCommand: "python backend/manage.py migrate --no-input && gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    plan: free
    autoDeploy: true
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SERVIPROX_DATABASE
        value: postgres
      # Render inyecta la cadena de conexion interna de la base declarada abajo.
      - key: DATABASE_URL
        fromDatabase:
          name: serviprox-db
          property: connectionString
      - key: SERVIPROX_MEDIA_STORAGE
        value: s3
      - key: SERVIPROX_S3_BUCKET_NAME
        sync: false
      - key: SERVIPROX_S3_ACCESS_KEY_ID
        sync: false
      - key: SERVIPROX_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SERVIPROX_S3_REGION_NAME
        sync: false
      - key: SERVIPROX_S3_ENDPOINT_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://cool-toffee-8b902e.netlify.app,https://serviproxweb.netlify.app,https://deploy-preview-2--serviproxweb.netlify.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://cool-toffee-8b902e.netlify.app,https://serviproxweb.netlify.app,https://deploy-preview-2--serviproxweb.netlify.app"

databases:
  - name: serviprox-db
    databaseName: serviprox
    user: serviprox
    plan: free
