name: serviprox-prod
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    image: postgres:16.15-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configura POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
  backend:
    image: serviprox-backend:${SERVIPROX_RELEASE:?Configura SERVIPROX_RELEASE con el commit}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        SERVIPROX_RELEASE: ${SERVIPROX_RELEASE:?Configura SERVIPROX_RELEASE}
    restart: unless-stopped
    init: true
    env_file:
      - ${SERVIPROX_ENV_FILE:-.env.production}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_production
      DJANGO_DEBUG: "False"
      SERVIPROX_DATABASE: postgres
      SERVIPROX_MEDIA_STORAGE: filesystem
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
    volumes:
      - media_data:/app/media
    networks: [application, database]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host':'127.0.0.1','X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=4).read()"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Configura API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Configura ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [application]
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging
networks:
  application:
  database:
    internal: true
volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
